<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Travel Selection</title>
</head>
<body>
    <h1>Travel Selection</h1>
    <form>
        <label for="country">Country:</label>
        <select id="country" name="country">
            <option value="india" selected>India</option>
            <option value="usa">USA</option>
            <option value="uk">United Kingdom</option>
            <option value="australia">Australia</option>
        </select>
        <br><br>

        <label for="state">State:</label>
        <select id="state" name="state">
            <option value="uttar-pradesh" selected>Uttar Pradesh</option>
            <option value="delhi">Delhi</option>
            <option value="maharashtra">Maharashtra</option>
            <option value="rajasthan">Rajasthan</option>
        </select>
        <br><br>

        <label for="city">City:</label>
        <select id="city" name="city">
            <option value="mathura" selected>Mathura</option>
            <option value="delhi">New Delhi</option>
            <option value="mumbai">Mumbai</option>
            <option value="jaipur">Jaipur</option>
        </select>
        <br><br>

        <label for="place">Favorite Tourist Place:</label>
        <select id="place" name="place">
            <option value="taj-mahal" selected>Taj Mahal</option>
            <option value="red-fort">Red Fort</option>
            <option value="gateway-of-india">Gateway of India</option>
            <option value="hawa-mahal">Hawa Mahal</option>
        </select>
    </form>
    <br>
    <p>
        My selected destination is Mathura, Uttar Pradesh, India,
        and my favorite tourist place is the Taj Mahal.
    </p>
</body>
</html>
