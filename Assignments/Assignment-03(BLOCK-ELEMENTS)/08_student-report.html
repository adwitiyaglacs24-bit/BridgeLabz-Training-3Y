<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Report</title>
</head>
<body>
    <h1>GLA University</h1>
    <h2>Student Report</h2>
    <table border="1" title="Student Marks Report">
        <tr>
            <th rowspan="2">Subject</th>
            <th colspan="2">Marks</th>
        </tr>

        <tr>
            <th>Maximum Marks</th>
            <th>Marks Obtained</th>
        </tr>

        <tr>
            <td title="Computer Science subject">Computer Science</td>
            <td>100</td>
            <td>88</td>
        </tr>

        <tr>
            <td title="Mathematics subject">Mathematics</td>
            <td>100</td>
            <td>85</td>
        </tr>

        <tr>
            <td title="Physics subject">Physics</td>
            <td>100</td>
            <td>82</td>
        </tr>

        <tr>
            <td title="English subject">English</td>
            <td>100</td>
            <td>90</td>
        </tr>

        <tr>
            <td title="Data Science subject">Data Science</td>
            <td>100</td>
            <td>87</td>
        </tr>

        <tr>
            <th colspan="2">Total</th>
            <td>432 / 500</td>
        </tr>

        <tr>
            <th colspan="2">Percentage</th>
            <td>86.4%</td>
        </tr>
    </table>
</body>
</html>
