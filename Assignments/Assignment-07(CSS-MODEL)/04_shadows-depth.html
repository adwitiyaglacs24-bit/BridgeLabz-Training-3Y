<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Shadows and Depth</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;

            font-family: Arial, sans-serif;
            background: #f2f2f2;

            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
        }

        h1 {
            text-shadow: 3px 3px 5px #aaa;
            margin-bottom: 40px;
        }

        .container {
            display: flex;
            gap: 30px;
            justify-content: center;
            flex-wrap: wrap;
        }

        .card {
            width: 250px;
            padding: 30px;

            background: white;
            border-radius: 15px;

            text-align: center;

            transition: all 0.4s ease;
        }

        .card1 {
            box-shadow: 5px 5px 15px #aaa;
        }

        .card2 {
            box-shadow: 0 10px 25px #bbb;
        }

        .card3 {
            box-shadow: inset 0 0 15px #ccc;
        }

        .card:hover {
            transform: translateY(-15px);
            box-shadow: 0 20px 35px #999;
        }
    </style>
</head>

<body>

    <h1>Shadows and Depth Effects</h1>

    <div class="container">

        <div class="card card1">
            <h2>Card 1</h2>
            <p>Basic box shadow effect.</p>
        </div>

        <div class="card card2">
            <h2>Card 2</h2>
            <p>Soft shadow effect.</p>
        </div>

        <div class="card card3">
            <h2>Card 3</h2>
            <p>Inset shadow effect.</p>
        </div>

    </div>

</body>
</html>
