<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Box Model Exploration</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;

            font-family: Arial, sans-serif;
            background: #f4f4f4;

            display: flex;
            justify-content: center;
            align-items: center;
        }

        .demo {
            text-align: center;
        }

        .margin-layer {
            padding: 40px;
            background: #ffeaa7;
            outline: 3px dashed #d35400;
        }

        .border-layer {
            padding: 25px;
            border: 12px solid #3498db;
            background: #74b9ff;
        }

        .padding-layer {
            padding: 30px;
            background: #55efc4;
        }

        .content {
            padding: 30px;
            background: #fd79a8;
            color: white;
            font-weight: bold;
        }

        .description {
            margin-top: 25px;
            background: white;
            padding: 20px;
            border-radius: 10px;
        }

        .box-sizing-demo {
            width: 300px;
            height: 100px;

            padding: 20px;
            border: 10px solid #2d3436;

            box-sizing: border-box;

            background: #81ecec;
            margin: 25px auto;
        }
    </style>
</head>

<body>

    <div class="demo">

        <h1>CSS Box Model</h1>

        <div class="margin-layer">

            Margin Layer

            <div class="border-layer">

                Border Layer

                <div class="padding-layer">

                    Padding Layer

                    <div class="content">
                        Content
                    </div>

                </div>

            </div>

        </div>

        <div class="description">
            <p><strong>Content:</strong> Actual text or element content.</p>
            <p><strong>Padding:</strong> Space between content and border.</p>
            <p><strong>Border:</strong> Line surrounding padding and content.</p>
            <p><strong>Margin:</strong> Space outside the border.</p>
        </div>

        <div class="box-sizing-demo">
            box-sizing: border-box
        </div>

    </div>

</body>
</html>
