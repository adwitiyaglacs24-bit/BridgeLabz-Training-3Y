<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Borders and Padding</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f4f6f8;
            color: #222;
        }

        h1 {
            text-align: center;
            margin: 30px;
        }

        .container {
            display: flex;
            justify-content: center;
            gap: 25px;
            flex-wrap: wrap;
        }

        .box {
            width: 200px;
            min-height: 150px;
            background: white;
            text-align: center;
            border-radius: 15px;
            transition: border-color 0.4s ease;
        }

        .box:hover {
            border-color: #e63946;
        }

        .solid {
            border: 5px solid #3498db;
            padding: 20px;
        }

        .dashed {
            border: 5px dashed #2ecc71;
            padding: 30px;
        }

        .double {
            border: 8px double #9b59b6;
            padding: 15px;
        }

        .groove {
            border: 8px groove #f39c12;
            padding: 25px;
        }

        .rounded {
            border: 5px solid #34495e;
            border-radius: 50px;
            padding: 20px;
        }
    </style>
</head>

<body>

    <h1>Borders and Padding Demonstration</h1>

    <div class="container">

        <div class="box solid">
            <h2>Solid</h2>
            <p>Padding: 20px</p>
        </div>

        <div class="box dashed">
            <h2>Dashed</h2>
            <p>Padding: 30px</p>
        </div>

        <div class="box double">
            <h2>Double</h2>
            <p>Padding: 15px</p>
        </div>

        <div class="box groove">
            <h2>Groove</h2>
            <p>Padding: 25px</p>
        </div>

        <div class="box rounded">
            <h2>Rounded</h2>
            <p>border-radius: 50px</p>
        </div>

    </div>

</body>
</html>
