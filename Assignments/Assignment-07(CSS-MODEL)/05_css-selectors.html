<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Advanced CSS Selectors</title>

    <style>

        body {
            font-family: Arial, sans-serif;
            background: #f5f5f5;
            padding: 30px;
        }

        h1 {
            text-align: center;
        }

        /* Attribute selector: selects input elements whose type is text */
        input[type="text"] {
            padding: 12px;
            border: 2px solid #3498db;
            border-radius: 6px;
        }

        /* Attribute selector: selects links beginning with https */
        a[href^="https"] {
            color: #27ae60;
            font-weight: bold;
        }

        /* :hover pseudo-class */
        li:hover {
            background: #dfe6e9;
            cursor: pointer;
        }

        /* :focus pseudo-class */
        input:focus {
            outline: 3px solid #f39c12;
        }

        /* :nth-child() pseudo-class */
        li:nth-child(odd) {
            background: #e8f4f8;
        }

        /* ::before pseudo-element */
        h2::before {
            content: "★ ";
        }

        /* ::after pseudo-element */
        h2::after {
            content: " ★";
        }

        /* Child combinator (>) */
        .container > p {
            color: #8e44ad;
        }

        /* Adjacent sibling combinator (+) */
        h2 + p {
            font-style: italic;
        }

        /* General sibling combinator (~) */
        h2 ~ ul {
            border-left: 4px solid #e74c3c;
            padding-left: 25px;
        }

        /* Descendant combinator */
        .container li {
            padding: 10px;
            margin: 5px;
        }

    </style>
</head>

<body>

    <h1>Advanced CSS Selectors</h1>

    <div class="container">

        <h2>Items List</h2>

        <p>This paragraph is a direct child of the container.</p>

        <input type="text" placeholder="Enter your name">

        <br><br>

        <a href="https://www.google.com">Secure HTTPS Link</a>

        <ul>
            <li>HTML</li>
            <li>CSS</li>
            <li>JavaScript</li>
            <li>React</li>
            <li>Node.js</li>
        </ul>

    </div>

</body>
</html>
