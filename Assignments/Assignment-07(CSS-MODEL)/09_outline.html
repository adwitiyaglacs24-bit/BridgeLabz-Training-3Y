<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Outline and Focus Form</title>

    <style>
        body {
            margin: 0;
            min-height: 100vh;

            display: flex;
            justify-content: center;
            align-items: center;

            font-family: Arial, sans-serif;
            background: #f1f2f6;
        }

        .form-container {
            width: 400px;
            padding: 30px;

            background: white;
            border-radius: 15px;

            box-shadow: 0 10px 25px #bbb;
        }

        h1 {
            text-align: center;
            margin-bottom: 25px;
        }

        label {
            display: block;
            margin-bottom: 6px;
            font-weight: bold;
        }

        input,
        textarea {
            width: 100%;

            padding: 12px;
            margin-bottom: 20px;

            border: 1px solid #aaa;
            border-radius: 8px;

            font-size: 1rem;

            transition: all 0.3s ease;
        }

        input:focus {
            outline: 3px solid #3498db;
            outline-offset: 3px;
        }

        textarea:focus {
            outline: 3px dashed #e67e22;
            outline-offset: 5px;
        }

        .submit {
            width: 100%;
            padding: 12px;

            border: none;
            border-radius: 8px;

            background: #2ecc71;
            color: white;

            cursor: pointer;
        }

        .submit:hover {
            background: #27ae60;
        }
    </style>
</head>

<body>

    <div class="form-container">

        <h1>Contact Form</h1>

        <form>

            <label>Name</label>
            <input type="text" placeholder="Enter your name">

            <label>Email</label>
            <input type="email" placeholder="Enter your email">

            <label>Message</label>
            <textarea rows="5" placeholder="Write your message"></textarea>

            <button class="submit" type="submit">
                Submit
            </button>

        </form>

    </div>

</body>
</html>
