<!DOCTYPE html>
<html>
<head>
    <title>Homepage</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }

        header {
            background: black;
            padding: 20px;
        }

        nav {
            display: flex;
            justify-content: space-around;
        }

        nav a {
            color: white;
            text-decoration: none;
        }

        main {
            flex: 1;
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 30px;
            padding: 30px;
        }

        .box {
            width: 250px;
            padding: 50px 20px;
            text-align: center;
            background: lightgray;
            border-radius: 10px;

            transition: 0.3s;
        }

        .box:hover {
            transform: rotate(2deg);
        }

        footer {
            background: black;
            color: white;
            text-align: center;
            padding: 15px;
        }

        @media (max-width: 700px) {
            main {
                flex-direction: column;
            }
        }
    </style>
</head>

<body>

    <header>
        <nav>
            <a href="#">Home</a>
            <a href="#">About</a>
            <a href="#">Services</a>
            <a href="#">Contact</a>
        </nav>
    </header>

    <main>

        <div class="box">
            <h2>Services</h2>
            <p>Our Services</p>
        </div>

        <div class="box">
            <h2>Projects</h2>
            <p>Our Projects</p>
        </div>

        <div class="box">
            <h2>Contact</h2>
            <p>Contact Us</p>
        </div>

    </main>

    <footer>
        © 2026 My Website
    </footer>

</body>
</html>
