<!DOCTYPE html>
<html>
<head>
    <title>Product Gallery</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            font-family: Arial;
            margin: 0;
            padding: 30px;
            background: #f5f5f5;
        }

        h1 {
            text-align: center;
        }

        .gallery {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 20px;
        }

        .card {
            background: white;
            padding: 30px;
            text-align: center;
            border-radius: 10px;

            min-height: 150px;

            transition: 0.3s;
        }

        .card:hover {
            transform: scale(1.05);
        }

        .price {
            font-weight: bold;
            margin-top: 15px;
        }

        @media (max-width: 900px) {
            .gallery {
                grid-template-columns: repeat(2, 1fr);
            }
        }

        @media (max-width: 600px) {
            .gallery {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>

<body>

    <h1>Product Gallery</h1>

    <div class="gallery">

        <div class="card">
            <h3>Laptop</h3>
            <p class="price">₹50,000</p>
        </div>

        <div class="card">
            <h3>Mobile Phone</h3>
            <p class="price">₹25,000</p>
        </div>

        <div class="card">
            <h3>Headphones</h3>
            <p class="price">₹2,000</p>
        </div>

        <div class="card">
            <h3>Smart Watch</h3>
            <p class="price">₹5,000</p>
        </div>

        <div class="card">
            <h3>Keyboard</h3>
            <p class="price">₹1,500</p>
        </div>

        <div class="card">
            <h3>Mouse</h3>
            <p class="price">₹800</p>
        </div>

        <div class="card">
            <h3>Speaker</h3>
            <p class="price">₹3,000</p>
        </div>

        <div class="card">
            <h3>Camera</h3>
            <p class="price">₹40,000</p>
        </div>

    </div>

</body>
</html>
