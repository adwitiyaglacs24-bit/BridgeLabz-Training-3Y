<!DOCTYPE html>
<html>
<head>
    <title>Dashboard</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial;
        }

        .dashboard {
            display: grid;
            grid-template-columns: 200px 1fr;
            grid-template-rows: 70px 1fr;
            min-height: 100vh;
            gap: 15px;
        }

        header {
            grid-column: 1 / 3;
            background: black;
            color: white;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        aside {
            background: #ddd;
            padding: 20px;
        }

        aside a {
            display: block;
            margin: 20px 0;
            text-decoration: none;
            color: black;
        }

        main {
            display: grid;
            grid-template-columns: 1fr 1fr;
            grid-template-rows: 1fr 1fr;
            gap: 20px;
            padding: 20px;
        }

        .box {
            padding: 30px;
            background: lightgray;
            border-radius: 10px;

            transition: 0.3s;
        }

        .box:hover {
            transform: scale(1.05);
            box-shadow: 0 5px 15px gray;
        }

        .box:first-child {
            grid-column: span 2;
        }

        @media (max-width: 700px) {

            .dashboard {
                grid-template-columns: 1fr;
                grid-template-rows: auto auto auto;
            }

            header {
                grid-column: 1;
            }

            main {
                grid-template-columns: 1fr;
            }

            .box:first-child {
                grid-column: span 1;
            }
        }
    </style>
</head>

<body>

    <div class="dashboard">

        <header>
            <h1>My Dashboard</h1>
        </header>

        <aside>
            <h3>Menu</h3>
            <a href="#">Home</a>
            <a href="#">Profile</a>
            <a href="#">Settings</a>
            <a href="#">Logout</a>
        </aside>

        <main>

            <div class="box">
                <h2>Box 1</h2>
                <p>Overview</p>
            </div>

            <div class="box">
                <h2>Box 2</h2>
                <p>Statistics</p>
            </div>

            <div class="box">
                <h2>Box 3</h2>
                <p>Projects</p>
            </div>

            <div class="box">
                <h2>Box 4</h2>
                <p>Notifications</p>
            </div>

        </main>

    </div>

</body>
</html>
