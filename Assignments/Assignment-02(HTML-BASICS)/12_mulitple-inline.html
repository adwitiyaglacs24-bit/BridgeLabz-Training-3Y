<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Inline Formatting</title>
</head>

<body>
    <p>
        I am <strong>passionate</strong> about learning
        <em><br>web development</em>. 
        <mark><br>HTML</mark> helps me create webpages, while
        <code><br>console.log("Hello World");</code> is a simple JavaScript command.
        <small><br>Learning something new every day!</small>
    </p>
</body>
</html>
