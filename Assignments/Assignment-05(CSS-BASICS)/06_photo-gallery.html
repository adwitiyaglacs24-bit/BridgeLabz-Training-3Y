<!DOCTYPE html>
<html>
<head>
    <title>Photo Gallery</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial;
            background-color: #eee;
            padding: 30px;
        }

        h1 {
            text-align: center;
            margin-bottom: 30px;
        }

        .gallery {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 25px;
        }

        .photo {
            position: relative;
            overflow: hidden;
            border-radius: 12px;
            box-shadow: 0 5px 15px #999;
        }

        .photo img {
            width: 100%;
            height: 250px;
            object-fit: cover;
            display: block;

            transition: transform 0.5s ease;
        }

        .photo:hover img {
            transform: scale(1.1);
        }

        .caption {
            position: absolute;
            bottom: 0;
            left: 0;
            width: 100%;

            padding: 15px;
            background-color: rgba(0, 0, 0, 0.7);
            color: white;

            opacity: 0;
            transition: 0.5s;
            text-align: center;
        }

        .photo:hover .caption {
            opacity: 1;
        }
    </style>
</head>

<body>

    <h1>My Photo Gallery</h1>

    <div class="gallery">

        <div class="photo">
            <img src="https://picsum.photos/400/300?random=1">
            <div class="caption">Beautiful View</div>
        </div>

        <div class="photo">
            <img src="https://picsum.photos/400/300?random=2">
            <div class="caption">Nature</div>
        </div>

        <div class="photo">
            <img src="https://picsum.photos/400/300?random=3">
            <div class="caption">Travel</div>
        </div>

        <div class="photo">
            <img src="https://picsum.photos/400/300?random=4">
            <div class="caption">Adventure</div>
        </div>

        <div class="photo">
            <img src="https://picsum.photos/400/300?random=5">
            <div class="caption">Mountains</div>
        </div>

        <div class="photo">
            <img src="https://picsum.photos/400/300?random=6">
            <div class="caption">City</div>
        </div>

    </div>

</body>
</html>
