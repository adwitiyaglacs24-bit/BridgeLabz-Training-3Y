<!DOCTYPE html>
<html>
<head>
    <title>Team Members</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial;
            background-color: #f5f5f5;
        }

        h1 {
            text-align: center;
            margin: 30px;
        }

        .team {
            display: flex;
            justify-content: center;
            gap: 25px;
            padding: 30px;
        }

        .card {
            width: 30%;
            padding: 30px;
            margin: 10px;
            background-color: white;
            border: 2px solid #ccc;
            border-radius: 15px;
            box-shadow: 0 5px 15px #aaa;
            text-align: center;
        }

        .card h2 {
            margin-bottom: 10px;
        }

        .card h3 {
            margin-bottom: 15px;
        }

        .leader {
            background-color: #e0f0ff;
            border: 3px solid #2277cc;
        }

        @media (max-width: 600px) {
            .team {
                flex-direction: column;
                align-items: center;
            }

            .card {
                width: 90%;
            }
        }
    </style>
</head>

<body>

    <h1>Our Team</h1>

    <div class="team">

        <div class="card leader">
            <h2>Adwitiya</h2>
            <h3>Team Lead</h3>
            <p>
                Leads the team and manages project activities.
            </p>
        </div>

        <div class="card">
            <h2>Rahul</h2>
            <h3>Developer</h3>
            <p>
                Works on coding and application development.
            </p>
        </div>

        <div class="card">
            <h2>Priya</h2>
            <h3>Designer</h3>
            <p>
                Designs interfaces and creates creative layouts.
            </p>
        </div>

    </div>

</body>
</html>
