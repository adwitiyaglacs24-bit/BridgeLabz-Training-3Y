<!DOCTYPE html>
<html>
<head>
    <title>Pricing Plans</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial;
            background-color: #f5f5f5;
        }

        h1 {
            text-align: center;
            margin: 30px;
        }

        .pricing {
            display: flex;
            justify-content: center;
            align-items: stretch;
            gap: 25px;
            padding: 30px;
        }

        .plan {
            width: 30%;
            padding: 30px;
            background-color: white;
            border: 2px solid #ccc;
            border-radius: 12px;
            text-align: center;

            display: flex;
            flex-direction: column;

            transition: 0.3s;
        }

        .plan:hover {
            transform: scale(1.05);
            background-color: #e8f4ff;
        }

        .popular {
            border: 3px solid #2277cc;
        }

        .plan ul {
            text-align: left;
            flex: 1;
            line-height: 2;
        }

        .price {
            font-size: 30px;
            font-weight: bold;
        }

        .plan a {
            display: inline-block;
            padding: 12px 25px;
            background-color: #222;
            color: white;
            text-decoration: none;
            border-radius: 5px;
        }

        @media (max-width: 700px) {
            .pricing {
                flex-direction: column;
                align-items: center;
            }

            .plan {
                width: 90%;
            }
        }
    </style>
</head>

<body>

    <h1>Pricing Plans</h1>

    <div class="pricing">

        <div class="plan">
            <h2>Basic</h2>

            <p class="price">₹199</p>

            <ul>
                <li>1 User</li>
                <li>Basic Support</li>
                <li>5 GB Storage</li>
            </ul>

            <a href="#">Choose Plan</a>
        </div>

        <div class="plan popular">
            <h2>Standard</h2>

            <p class="price">₹499</p>

            <ul>
                <li>5 Users</li>
                <li>Priority Support</li>
                <li>50 GB Storage</li>
            </ul>

            <a href="#">Choose Plan</a>
        </div>

        <div class="plan">
            <h2>Premium</h2>

            <p class="price">₹799</p>

            <ul>
                <li>Unlimited Users</li>
                <li>24/7 Support</li>
                <li>100 GB Storage</li>
            </ul>

            <a href="#">Choose Plan</a>
        </div>

    </div>

</body>
</html>
