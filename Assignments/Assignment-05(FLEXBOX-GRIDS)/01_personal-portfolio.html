<!doctype html>
<html>
  <head>
    <title>My Portfolio</title>

    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }

      body {
        font-family: Arial;
        min-height: 100vh;
        display: flex;
        flex-direction: column;
      }

      header {
        display: flex;
        justify-content: space-between;
        align-items: center;
        padding: 20px 40px;
        background: black;
        color: white;
      }

      nav {
        display: flex;
        gap: 20px;
      }

      nav a {
        color: white;
        text-decoration: none;
      }

      main {
        flex: 1;
        display: flex;
        justify-content: center;
        align-items: center;
        gap: 50px;
        padding: 40px;
      }

      .about,
      .image {
        width: 40%;
      }

      .image {
        text-align: center;
      }

      .image img {
        width: 250px;
        height: 250px;
        border-radius: 50%;
      }

      footer {
        text-align: center;
        padding: 15px;
        background: black;
        color: white;
      }

      @media (max-width: 700px) {
        header,
        main {
          flex-direction: column;
        }

        main {
          gap: 30px;
          text-align: center;
        }

        .about,
        .image {
          width: 100%;
        }
      }
    </style>
  </head>

  <body>
    <header>
      <h1>Adwitiya</h1>

      <nav>
        <a href="#">Home</a>
        <a href="#">About</a>
        <a href="#">Skills</a>
        <a href="#">Contact</a>
      </nav>
    </header>

    <main>
      <section class="about">
        <h2>About Me</h2>
        <p>
          I am a Computer Science student interested in programming, web
          development and technology.
        </p>
      </section>

      <section class="image">
        <img src="https://via.placeholder.com/250" alt="Profile" />
      </section>
    </main>

    <footer>© 2026 My Portfolio</footer>
  </body>
</html>
